# MacBook Air-specific personal Hyprland configuration.

# Non-retina MacBook Air panels are cramped at Omarchy's larger HiDPI scales.
monitor = eDP-1, preferred, auto, 1
env = GDK_SCALE,1

unbind = SUPER, code:61
unbind = SUPER ALT, code:61
bindd = SUPER, code:61, Cycle MacBook Air scaling, exec, $HOME/.local/bin/kc-hyprland-monitor-scaling-cycle
bindd = SUPER ALT, code:61, Cycle MacBook Air scaling backwards, exec, $HOME/.local/bin/kc-hyprland-monitor-scaling-cycle --reverse

input {
  touchpad {
    natural_scroll = true
    scroll_factor = 0.4
  }
}
